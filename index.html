<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Travel Map</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="map-layout">
      <div class="map-frame">
        <div id="mapStatus" class="status">Loading map…</div>

        <svg id="worldMap" role="img"
             aria-label="World map showing visited countries and city dots"></svg>

        <div class="zoom-controls">
          <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
          <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
          <button id="zoomReset" type="button" aria-label="Reset view">↺</button>
        </div>

        <aside id="detailPanel" class="detail-panel" aria-live="polite">
          <div class="empty-state">
            <h2>Select a place</h2>
            <p>Click a shaded country or a city dot to see travel details and photos.</p>
          </div>
        </aside>
      </div>
    </section>

    <!-- Visited countries, grouped by region. Built from travels.csv. -->
    <section id="countryIndex" class="country-index" aria-label="Visited countries"></section>

    <footer>
      <p>Last updated <span id="lastUpdated">—</span></p>
    </footer>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <button id="closeLightbox" type="button" aria-label="Close image">×</button>
    <img id="lightboxImage" alt="">
    <p id="lightboxCaption"></p>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
